<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物比价助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
               background: #f5f6fa; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; padding: 30px 16px; }
        h1 { font-size: 28px; text-align: center; color: #2d3436; margin-bottom: 6px; }
        .subtitle { text-align: center; color: #95a5a6; font-size: 15px; margin-bottom: 30px; }
        .search-box { background: #fff; border-radius: 16px; padding: 24px;
                      box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        input[type=text] { width: 100%; font-size: 18px; padding: 14px 16px;
                           border: 2px solid #dfe6e9; border-radius: 12px;
                           outline: none; transition: border 0.2s; }
        input[type=text]:focus { border-color: #0984e3; }
        .cats { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
        .cat { flex: 1; min-width: 80px; padding: 10px 0; text-align: center;
               border: 2px solid #dfe6e9; border-radius: 10px; font-size: 15px;
               cursor: pointer; background: #fff; color: #636e72; transition: all 0.2s; }
        .cat:hover { border-color: #0984e3; color: #0984e3; }
        .cat.active { background: #0984e3; border-color: #0984e3; color: #fff; }
        .cat.empty { border-style: dashed; }
        button { width: 100%; font-size: 20px; font-weight: 600; padding: 14px;
                 background: #0984e3; color: #fff; border: none; border-radius: 12px;
                 cursor: pointer; margin-top: 8px; }
        button:active { background: #0765b0; }
        .error { color: #d63031; text-align: center; margin-top: 16px; font-size: 16px; }
        .tips { text-align: center; color: #b2bec3; font-size: 13px; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 购物比价助手</h1>
        <div class="subtitle">淘宝 + 拼多多，一个词查全网</div>
        <form method="post" action="/search">
            <div class="search-box">
                <input type="text" name="keyword" placeholder="想买什么？例如：金典纯牛奶" required>
                <input type="hidden" name="category" id="category" value="">
                <div class="cats">
                    <div class="cat empty" data-cat="">全部</div>
                    <div class="cat" data-cat="服饰">👗 服饰</div>
                    <div class="cat" data-cat="食品">🥛 食品</div>
                    <div class="cat" data-cat="日用百货">🧴 日用百货</div>
                    <div class="cat" data-cat="数码家电">💻 数码家电</div>
                </div>
                <button type="submit">开始比价</button>
            </div>
        </form>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <div class="tips">提示：选品类比价更准（能按规格分组）</div>
    </div>
    <script>
        document.querySelectorAll('.cat').forEach(el => {
            el.addEventListener('click', () => {
                document.querySelectorAll('.cat').forEach(e => e.classList.remove('active'));
                el.classList.add('active');
                document.getElementById('category').value = el.dataset.cat;
            });
        });
    </script>
</body>
</html>
