<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go购 - 全网比价助手</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .search-box { background: #fff; border-radius: 16px; padding: 24px;
                      box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        input[type=text] { width: 100%; font-size: 20px; padding: 14px 16px;
                           border: 2px solid #dfe6e9; border-radius: 12px;
                           outline: none; transition: border 0.2s; min-height: 52px; }
        input[type=text]:focus { border-color: #ff6b35; box-shadow: 0 0 0 3px rgba(255,107,53,0.15); }
        .cats { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
        .cat { flex: 1; min-width: 84px; padding: 12px 0; text-align: center;
               border: 2px solid #dfe6e9; border-radius: 24px; font-size: 15px;
               cursor: pointer; background: #fff; color: #636e72; transition: all 0.2s; }
        .cat:hover { border-color: #ff6b35; color: #ff6b35; }
        .cat.active { background: #ff6b35; border-color: #ff6b35; color: #fff; }
        .cat.empty { border-style: dashed; }
        #search-btn { width: 100%; font-size: 20px; padding: 14px; margin-top: 8px; }
        #progress { display: none; text-align: center; color: #ff6b35; font-size: 16px;
                    margin-top: 18px; line-height: 1.8; }
        .quick { display: flex; gap: 12px; margin-top: 18px; justify-content: center; }
        .quick a { text-decoration: none; font-size: 15px; padding: 10px 16px;
                   border-radius: 24px; min-height: 44px; display: inline-flex; align-items: center; }
        .quick .q1 { background: #e8f7ee; color: #27ae60; }
        .quick .q2 { background: #eaf2fb; color: #0984e3; }
            .sub-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
        .sub-btns .btn { flex: 1; min-width: 140px; }
        .loading-tip { display: none; text-align: center; font-size: 15px; margin-top: 10px; }
        .subsidy-bar { background: linear-gradient(135deg,#ff6b35,#e74c3c); color: #fff;
                       border-radius: 12px; padding: 12px 16px; margin-bottom: 14px;
                       font-size: 14px; line-height: 1.9; box-shadow: 0 2px 10px rgba(255,107,53,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Go购</h1>
        <div class="subtitle">淘宝 + 京东 + 拼多多，一个词查全网</div>
        <div class="search-box">
            <input type="text" id="kw" placeholder="说人话也行：帮我看石头岛的外套">
            <input type="hidden" id="cat" value="">
            <div class="cats">
                <div class="cat empty active" data-cat="">全部</div>
                <div class="cat" data-cat="服饰">👗 服饰</div>
                <div class="cat" data-cat="食品">🥛 食品</div>
                <div class="cat" data-cat="日用百货">🧴 日用百货</div>
                <div class="cat" data-cat="数码家电">💻 数码家电</div>
            </div>
            <button type="button" id="search-btn" class="btn btn-tb" onclick="doSearch()">开始比价</button>
        </div>
        <div id="progress" style="display:none;text-align:center;color:#0984e3;font-size:15px;margin-top:16px"></div>
        <div id="sse-result"></div>
        <div class="quick">
            <a class="q1" href="/items">🛍️ 商品库</a>
            <a class="q2" href="/watches">🎯 盯价清单</a>
            <a class="q2" href="/submit">📝 录入好价</a>
        </div>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <div class="tips">提示：选品类比价更准（能按规格分组）<br><a href="/submit" style="color:#27ae60;font-size:14px;">📝 录入好价（补盲区）</a> ・ <a href="/watches" style="color:#0984e3;font-size:14px;">🎯 盯价清单</a></div>
    </div>
    <script>
        document.querySelectorAll('.cat').forEach(el => {
            el.addEventListener('click', () => {
                document.querySelectorAll('.cat').forEach(e => e.classList.remove('active'));
                el.classList.add('active');
                document.getElementById('cat').value = el.dataset.cat;
            });
        });

        function tbSearch() {
            var btn = document.getElementById('tb-btn');
            if (!btn) return;
            btn.disabled = true;
            document.getElementById('tb-loading').style.display = 'block';
            fetch('/search_tb?keyword=' + encodeURIComponent(document.getElementById('kw').value.trim()))
                .then(r => r.json())
                .then(data => {
                    document.getElementById('tb-loading').style.display = 'none';
                    var box = document.getElementById('jd-results');
                    if (!data.items || !data.items.length) { box.innerHTML = '<div style="text-align:center;color:#b2bec3;padding:16px">淘宝没搜到或遇到验证码</div>'; }
                    else {
                        var html = '<div class="group"><div class="group-head"><span class="sku">🛒 淘宝全量结果（' + data.items.length + ' 条）</span></div>';
                        data.items.forEach(function(it) {
                            html += '<div class="item"><span class="plat" style="background:#ff5000;color:#fff">淘宝</span>' +
                                '<div class="info"><div class="title">' + (it.is_p4p ? '【广告】' : '') + (it.is_tmall ? '【天猫】' : '') + it.title + '</div>' +
                                '<div class="shop">' + (it.shop_name || '') + ' ・ ' + (it.province || '') + ' ・ ' + (it.real_sales || '') + '</div></div>' +
                                '<div class="price"><div class="now">¥' + (it.price || '?') + '</div></div></div>';
                        });
                        box.innerHTML = html + '</div>';
                    }
                    btn.disabled = false;
                })
                .catch(() => { document.getElementById('tb-loading').style.display = 'none'; btn.disabled = false; });
        }
        function jdSearch() {
            var btn = document.getElementById('jd-btn');
            if (!btn) return;
            btn.disabled = true;
            document.getElementById('jd-loading').style.display = 'block';
            fetch('/search_jd?keyword=' + encodeURIComponent(document.getElementById('kw').value.trim()), {timeout: 60000})
                .then(r => r.json())
                .then(data => {
                    document.getElementById('jd-loading').style.display = 'none';
                    var box = document.getElementById('jd-results');
                    if (!data.items || !data.items.length) { box.innerHTML = '<div style="text-align:center;color:#b2bec3;padding:16px">京东没搜到或遇到验证码</div>'; }
                    else {
                        var html = '<div class="group"><div class="group-head"><span class="sku">🛒 京东结果（' + data.items.length + ' 条）</span></div>';
                        data.items.forEach(function(it) {
                            html += '<div class="item"><span class="plat" style="background:#e4393c;color:#fff">京东</span>' +
                                '<div class="info"><div class="title">' + (it.is_ad ? '【广告】' : '') + it.title + '</div>' +
                                '<div class="shop">' + (it.shop || '') + ' ・ ' + (it.sales || '') + '</div></div>' +
                                '<div class="price"><div class="now">¥' + (it.price || '?') + '</div></div></div>';
                        });
                        box.innerHTML = html + '</div>';
                    }
                    btn.disabled = false;
                })
                .catch(() => { document.getElementById('jd-loading').style.display = 'none'; btn.disabled = false; });
        }
        function biliSearch() {
            var btn = document.getElementById('bili-btn');
            if (!btn) return;
            btn.disabled = true;
            document.getElementById('bili-loading').style.display = 'block';
            fetch('/search_bili?keyword=' + encodeURIComponent(document.getElementById('kw').value.trim()), {timeout: 180000})
                .then(r => r.json())
                .then(data => {
                    document.getElementById('bili-loading').style.display = 'none';
                    var box = document.getElementById('jd-results');
                    if (!data.items || !data.items.length) { box.innerHTML = '<div style="text-align:center;color:#b2bec3;padding:16px">没搜到相关内容</div>'; }
                    else {
                        var html = '<div class="group"><div class="group-head"><span class="sku">📺 内容联动（' + data.items.length + ' 条）</span></div>';
                        data.items.forEach(function(it) {
                            var isBili = it.type === 'bili';
                            var isXhs = it.type === 'xhs';
                            var platStyle = isBili ? 'background:#00a1d6' : (isXhs ? 'background:#ff2442' : 'background:#4a90d9');
                            var platName = isBili ? 'B站' : (isXhs ? '小红书' : '贴吧');
                            var meta = isBili ? ('UP主: ' + it.author + ' ・ 播放 ' + it.play + ' ・ 点赞 ' + it.like)
                                              : (isXhs ? ('作者: ' + it.author + ' ・ 赞 ' + it.like)
                                                       : ('作者: ' + it.author + ' ・ 吧: ' + it.desc));
                            if (it.score) {
                                var star = '★'.repeat(Math.max(1, Math.round(it.score / 20))) + '☆'.repeat(5 - Math.max(1, Math.round(it.score / 20)));
                                meta += '<br>⭐ 可信度 ' + star + ' ' + it.score + '/100';
                                if (it.sent && (it.sent.neg > 0 || it.sent.ad > 0)) {
                                    meta += '<br>👎 负面 ' + it.sent.neg + ' 条' + (it.sent.ad ? ' ⚠️软广嫌疑 ' + it.sent.ad + ' 条' : '');
                                    if (it.sent.neg > 3) meta += ' <span style="color:#e67e22">【有争议，建议自己思考】</span>';
                                }
                                if (it.flags && it.flags.length) meta += '<br><span style="color:#95a5a6">' + it.flags.join(' / ') + '</span>';
                            }
                            html += '<div class="item"><span class="plat" style="' + platStyle + ';color:#fff">' + platName + '</span>' +
                                '<div class="info"><div class="title">' + it.title + '</div>' +
                                '<div class="shop">' + meta + '</div></div>' +
                                (it.url ? '<a class="link" href="' + it.url + '" target="_blank" rel="noopener">' + (isBili ? '观看 ↗' : '帖子 ↗') + '</a>' : '') + '</div>';
                        });
                        box.innerHTML = html + '</div>';
                    }
                    btn.disabled = false;
                })
                .catch(() => { document.getElementById('bili-loading').style.display = 'none'; btn.disabled = false; });
        }


        var guideRound = 0;
        function renderGuide(options, kw, prog, box) {
            guideRound += 1;
            var html = '<div class="group" style="border:2px solid #ff6b35"><div class="group-head">' +
                '<span class="sku">🤔 结果较多，你想要哪个？</span></div>';
            options.forEach(function(opt) {
                var isCustom = opt.search_kw === '__custom__';
                html += '<div class="item" style="cursor:pointer;border:1.5px solid #dfe6e9;margin-bottom:8px" ' +
                    'onclick="guideSelect(this)" data-kw="' + (isCustom ? '__custom__' : opt.search_kw) + '" data-label="' + opt.label + '">' +
                    '<div class="info"><div class="title">' + (isCustom ? '✏️ ' : '') + opt.label + '</div>' +
                    (opt.price_hint ? '<div class="shop">💰 ' + opt.price_hint + '</div>' : '') +
                    (isCustom ? '<div class="shop">告诉我你想要什么样的，我来帮你找</div>' : '') +
                    '</div><div style="color:#ff6b35;font-size:20px">›</div></div>';
            });
            html += '<div style="text-align:center;color:#b2bec3;font-size:13px;margin-top:6px">或直接浏览下方全部结果 ↓</div></div>';
            var div = document.createElement('div');
            div.id = 'guide-box';
            div.innerHTML = html;
            box.parentNode.insertBefore(div, box);
            document.getElementById('guide-round') ? null : (function(){
                var inp = document.createElement('input');
                inp.type = 'hidden'; inp.id = 'guide-round'; inp.value = '0';
                document.body.appendChild(inp);
            })();
            document.getElementById('guide-round').value = guideRound;
        }
        function guideSelect(el) { var kw2 = el.getAttribute('data-kw'); var label = el.getAttribute('data-label');
            if (kw2 === '__custom__') {
                var desc = prompt('请描述你想要的商品（例如：14寸轻薄本，续航好）');
                if (!desc) return;
                document.getElementById('kw').value = desc;
            } else {
                document.getElementById('kw').value = kw2;
            }
            document.getElementById('guide-round').value = guideRound;
            document.getElementById('sse-result').innerHTML = '';
            var gb = document.getElementById('guide-box');
            if (gb) gb.remove();
            doSearch();
        }

        function doSearch() {
            var kw = document.getElementById('kw').value.trim();
            if (!kw) { alert('请输入商品名称'); return; }
            var cat = document.getElementById('cat').value;
            var prog = document.getElementById('progress');
            var box = document.getElementById('sse-result');
            var btn = document.getElementById('search-btn');
            btn.disabled = true;
            prog.style.display = 'block';
            prog.innerHTML = '<span class="spinner"></span>开始搜索...';
            box.innerHTML = '';
            var round = document.getElementById('guide-round') ? document.getElementById('guide-round').value : 0;
            fetch('/search_sse?keyword=' + encodeURIComponent(kw) + '&category=' + encodeURIComponent(cat) + '&guide_round=' + round)
                .then(resp => {
                    var reader = resp.body.getReader();
                    var decoder = new TextDecoder();
                    var buffer = '';
                    function read() {
                        return reader.read().then(function(result) {
                            if (result.done) return;
                            buffer += decoder.decode(result.value, {stream: true});
                                                        var lines = buffer.split("\n\n");
                            buffer = lines.pop();
                            lines.forEach(function(evt) {
                                if (!evt.startsWith('data: ')) return;
                                var data = JSON.parse(evt.slice(6));
                                if (data.type === 'guide') { renderGuide(data.options, kw, prog, box); }
                                else if (data.type === 'progress') { prog.innerText = data.msg; }
                                else if (data.type === 'error') { prog.style.display = 'none'; box.innerHTML = '<div style="color:#d63031;text-align:center">' + data.msg + '</div>'; }
                                else if (data.type === 'done') {
                                    prog.style.display = 'none';
                                    renderResult(data, box);
                                }
                            });
                            return read();
                        });
                    }
                    return read();
                }).catch(() => { prog.style.display = 'none'; box.innerHTML = '<div style="color:#d63031;text-align:center">搜索失败</div>'; });
        }
        function loadHistory(el) {
            var item = el.closest('.item');
            var box = item.querySelector('.hist-box');
            if (box.style.display !== 'none') { box.style.display = 'none'; return; }
            var platform = el.getAttribute('data-plat');
            var gid = decodeURIComponent(el.getAttribute('data-gid'));
            box.innerHTML = '加载中…';
            box.style.display = 'block';
            fetch('/history?platform=' + platform + '&item_id=' + encodeURIComponent(gid))
                .then(r => r.json())
                .then(data => {
                    if (!data.length) { box.innerHTML = '暂无历史记录（价格会随每次查询自动积累）'; return; }
                    var summary = data[data.length - 1].summary;
                    var diff = summary.current - summary.lowest;
                    var advice = diff <= 0 ? '✅ 当前价 = 历史最低，可以买' :
                        '⚠️ 比历史最低贵 ¥' + diff.toFixed(2) + '，不急可再等等';
                    box.innerHTML = '<div class="hist-advice">历史最低 ¥' + summary.lowest.toFixed(2) +
                        '（共记录 ' + summary.count + ' 次）</div>' +
                        '<div class="hist-advice" style="color:' + (diff <= 0 ? '#27ae60' : '#e67e22') + '">' + advice + '</div>' +
                        '<div class="hist-chart" id="hist-chart-' + platform + '-' + encodeURIComponent(gid) + '"></div>' +
                        '<div class="hist-rows">' + data.slice(0, 8).map(function(d) {
                            return d.queried_at.slice(0, 16) + ' → ¥' + d.price +
                                (d.coupon_amount ? '（券¥' + d.coupon_amount + '）' : '');
                        }).join('<br>') + '</div>';
                    drawChart(platform, gid, data);
                })
                .catch(() => box.innerHTML = '加载失败');
        }
        function drawChart(platform, gid, data) {
            var cid = 'hist-chart-' + platform + '-' + encodeURIComponent(gid);
            function paint() {
                var el = document.getElementById(cid);
                if (!el || !window.echarts) return;
                var pts = data.slice(0, -1).reverse().map(function(d) {
                    return [d.queried_at.slice(5, 16), d.price];
                });
                var chart = echarts.init(el);
                chart.setOption({
                    grid: { left: 44, right: 12, top: 14, bottom: 24 },
                    tooltip: { trigger: 'axis' },
                    xAxis: { type: 'category', data: pts.map(p => p[0]), axisLabel: { fontSize: 10 } },
                    yAxis: { type: 'value', scale: true, axisLabel: { fontSize: 10 } },
                    series: [{
                        name: '价格', type: 'line', data: pts.map(p => p[1]),
                        smooth: true, symbolSize: 6,
                        lineStyle: { color: '#ff6b35', width: 2.5 },
                        itemStyle: { color: '#ff6b35' },
                        areaStyle: { color: 'rgba(255,107,53,0.12)' },
                        markPoint: { data: [{ type: 'min', name: '最低' }] }
                    }]
                });
            }
            if (window.echarts) { paint(); return; }
            var s = document.createElement('script');
            s.src = 'https://cdn.staticfile.org/echarts/5.5.0/echarts.min.js';
            s.onload = paint;
            document.head.appendChild(s);
        }
        function renderResult(d, box) {
            var html = '<div class="stat">淘宝 ' + d.tb_count + ' 条 + 拼多多 ' + d.pdd_count + ' 条' +
                (d.manual_count ? ' + 人工录入 ' + d.manual_count + ' 条' : '') + ' = ' + d.total + ' 条候选</div>';
            if (d.subsidies && d.subsidies.length) {
                html += '<div class="subsidy-bar">';
                d.subsidies.forEach(function(s) {
                    html += '🎯 <b>[' + s.category + ']</b> ' + s.requirements +
                        (s.region ? '（' + s.region + '）' : '') +
                        (s.valid_to ? ' 至 ' + s.valid_to : '') +
                        (s.source_url ? ' <a href="' + s.source_url + '" target="_blank" rel="noopener" style="color:#fff">来源↗</a>' : '') +
                        '<br>';
                });
                html += '</div>';
            }
            if (!d.groups.length) {
                html += '<div class="empty">没有搜到结果（该商品可能未设置推广佣金）</div>';
                html += '<div class="sub-btns" style="margin-top:20px">' +
                    '<button onclick="tbSearch()" id="tb-btn" class="btn btn-tb">🛒 用淘宝补搜</button>' +
                    '<button onclick="jdSearch()" id="jd-btn" class="btn btn-jd">🔍 用京东补搜</button>' +
                    '<button onclick="biliSearch()" id="bili-btn" class="btn btn-bili">📺 内容联动</button></div>';
                html += '<div id="tb-loading" class="loading-tip" style="color:#ff5000">正在淘宝搜索…</div>';
                html += '<div id="jd-loading" class="loading-tip" style="color:#e4393c">正在京东搜索…</div>';
                html += '<div id="bili-loading" class="loading-tip" style="color:#00a1d6">正在搜索相关内容…</div>';
                html += '<div id="jd-results"></div>';
            }
            d.groups.forEach(function(g) {
                html += '<div class="group"><div class="group-head"><span class="sku">📦 ' + g.key + '</span><span class="count">' + g.count + ' 个候选</span></div>';
                g.platforms.forEach(function(it) {
                    var isBest = g.best && it === g.best;
                    var gid = it.goodsId || it.item_id || '';
                    html += '<div class="item' + (isBest ? ' best' : '') + '">' +
                        '<span class="plat">' + (it.platform === 'tb' ? '淘宝' : '拼多多') + '</span>' +
                        '<div class="info"><div class="title">' + it.title + '</div>' +
                        '<div class="shop">' + (it.shopName || '') + (isBest ? '<span class="badge">最低价</span>' : '') +
                        (gid ? '<a class="link" href="javascript:void(0)" data-plat="' + it.platform + '" data-gid="' + encodeURIComponent(gid) + '" onclick="loadHistory(this)">📈 历史价</a>' : '') +
                        '</div><div class="hist-box" style="display:none"></div></div>' +
                        '<div class="price"><div class="now">¥' + it.actualPrice + '</div>' +
                        (it.coupon_amount > 0 ? '<div class="coupon">券后省 ¥' + it.coupon_amount + '</div>' : '') +
                        (it.originalPrice > it.actualPrice ? '<div class="old">¥' + it.originalPrice + '</div>' : '') +
                        '</div></div>';
                });
                html += '</div>';
            });
            if (d.content && d.content.items && d.content.items.length) {
                html += '<div class="group"><div class="group-head"><span class="sku">📺 相关内容（' + d.content.items.length + ' 条）</span></div>';
                if (d.content.trap) {
                    html += '<div class="alert-bar">⚠️ 价格套路提醒：' + (d.content.trap.trap || '') + ' ' + (d.content.trap.fake || '') + '</div>';
                }
                d.content.items.forEach(function(it) {
                    var isBili = it.type === 'bili';
                    var isXhs = it.type === 'xhs';
                    var platStyle = isBili ? 'background:#00a1d6' : (isXhs ? 'background:#ff2442' : 'background:#4a90d9');
                    var platName = isBili ? 'B站' : (isXhs ? '小红书' : '贴吧');
                    var meta = isBili ? ('UP主: ' + it.author + ' ・ 播放 ' + it.play + ' ・ 点赞 ' + it.like)
                                      : (isXhs ? ('作者: ' + it.author + ' ・ 赞 ' + it.like)
                                               : ('作者: ' + it.author + ' ・ 吧: ' + it.desc));
                    if (it.score) {
                        var star = '★'.repeat(Math.max(1, Math.round(it.score / 20))) + '☆'.repeat(5 - Math.max(1, Math.round(it.score / 20)));
                        meta += '<br>⭐ 可信度 ' + star + ' ' + it.score + '/100';
                        if (it.sent && (it.sent.neg > 0 || it.sent.ad > 0)) {
                            meta += '<br>👎 负面 ' + it.sent.neg + ' 条' + (it.sent.ad ? ' ⚠️软广嫌疑 ' + it.sent.ad + ' 条' : '');
                            if (it.sent.neg > 3) meta += ' <span style="color:#e67e22">【有争议，建议自己思考】</span>';
                        }
                        if (it.flags && it.flags.length) meta += '<br><span style="color:#95a5a6">' + it.flags.join(' / ') + '</span>';
                    }
                    html += '<div class="item"><span class="plat" style="' + platStyle + ';color:#fff">' + platName + '</span>' +
                        '<div class="info"><div class="title">' + it.title + '</div>' +
                        '<div class="shop">' + meta + '</div></div>' +
                        (it.url ? '<a class="link" href="' + it.url + '" target="_blank" rel="noopener">' + (isBili ? '观看 ↗' : '帖子 ↗') + '</a>' : '') + '</div>';
                });
                html += '</div>';
            }
            html += '<div style="text-align:center;margin-top:16px"><a href="/" class="back-home">← 再查一个</a></div>';
            box.innerHTML = html;
        }
    </script>
