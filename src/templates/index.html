<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物比价助手</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .search-box { background: #fff; border-radius: 16px; padding: 24px;
                      box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        input[type=text] { width: 100%; font-size: 20px; padding: 14px 16px;
                           border: 2px solid #dfe6e9; border-radius: 12px;
                           outline: none; transition: border 0.2s; min-height: 52px; }
        input[type=text]:focus { border-color: #ff6b35; box-shadow: 0 0 0 3px rgba(255,107,53,0.15); }
        .cats { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
        .cat { flex: 1; min-width: 84px; padding: 12px 0; text-align: center;
               border: 2px solid #dfe6e9; border-radius: 24px; font-size: 15px;
               cursor: pointer; background: #fff; color: #636e72; transition: all 0.2s; }
        .cat:hover { border-color: #ff6b35; color: #ff6b35; }
        .cat.active { background: #ff6b35; border-color: #ff6b35; color: #fff; }
        .cat.empty { border-style: dashed; }
        #search-btn { width: 100%; font-size: 20px; padding: 14px; margin-top: 8px; }
        #progress { display: none; text-align: center; color: #ff6b35; font-size: 16px;
                    margin-top: 18px; line-height: 1.8; }
        .quick { display: flex; gap: 12px; margin-top: 18px; justify-content: center; }
        .quick a { text-decoration: none; font-size: 15px; padding: 10px 16px;
                   border-radius: 24px; min-height: 44px; display: inline-flex; align-items: center; }
        .quick .q1 { background: #e8f7ee; color: #27ae60; }
        .quick .q2 { background: #eaf2fb; color: #0984e3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 购物比价助手</h1>
        <div class="subtitle">淘宝 + 拼多多，一个词查全网</div>
        <div class="search-box">
            <input type="text" id="kw" placeholder="说人话也行：帮我看石头岛的外套">
            <input type="hidden" id="cat" value="">
            <div class="cats">
                <div class="cat empty active" data-cat="">全部</div>
                <div class="cat" data-cat="服饰">👗 服饰</div>
                <div class="cat" data-cat="食品">🥛 食品</div>
                <div class="cat" data-cat="日用百货">🧴 日用百货</div>
                <div class="cat" data-cat="数码家电">💻 数码家电</div>
            </div>
            <button type="button" id="search-btn" class="btn btn-tb" onclick="doSearch()">开始比价</button>
        </div>
        <div id="progress" style="display:none;text-align:center;color:#0984e3;font-size:15px;margin-top:16px"></div>
        <div id="sse-result"></div>
        <div class="quick">
            <a class="q1" href="/watches">🎯 盯价清单</a>
            <a class="q2" href="/submit">📝 录入好价</a>
        </div>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <div class="tips">提示：选品类比价更准（能按规格分组）<br><a href="/submit" style="color:#27ae60;font-size:14px;">📝 录入好价（补盲区）</a> ・ <a href="/watches" style="color:#0984e3;font-size:14px;">🎯 盯价清单</a></div>
    </div>
    <script>
        document.querySelectorAll('.cat').forEach(el => {
            el.addEventListener('click', () => {
                document.querySelectorAll('.cat').forEach(e => e.classList.remove('active'));
                el.classList.add('active');
                document.getElementById('cat').value = el.dataset.cat;
            });
        });
        function doSearch() {
            var kw = document.getElementById('kw').value.trim();
            if (!kw) { alert('请输入商品名称'); return; }
            var cat = document.getElementById('cat').value;
            var prog = document.getElementById('progress');
            var box = document.getElementById('sse-result');
            var btn = document.getElementById('search-btn');
            btn.disabled = true;
            prog.style.display = 'block';
            prog.innerHTML = '<span class="spinner"></span>开始搜索...';
            box.innerHTML = '';
            fetch('/search_sse?keyword=' + encodeURIComponent(kw) + '&category=' + encodeURIComponent(cat))
                .then(resp => {
                    var reader = resp.body.getReader();
                    var decoder = new TextDecoder();
                    var buffer = '';
                    function read() {
                        return reader.read().then(function(result) {
                            if (result.done) return;
                            buffer += decoder.decode(result.value, {stream: true});
                            var lines = buffer.split('

');
                            buffer = lines.pop();
                            lines.forEach(function(evt) {
                                if (!evt.startsWith('data: ')) return;
                                var data = JSON.parse(evt.slice(6));
                                if (data.type === 'progress') { prog.innerText = data.msg; }
                                else if (data.type === 'error') { prog.style.display = 'none'; box.innerHTML = '<div style="color:#d63031;text-align:center">' + data.msg + '</div>'; }
                                else if (data.type === 'done') {
                                    prog.style.display = 'none';
                                    renderResult(data, box);
                                }
                            });
                            return read();
                        });
                    }
                    return read();
                }).catch(() => { prog.style.display = 'none'; box.innerHTML = '<div style="color:#d63031;text-align:center">搜索失败</div>'; });
        }
        function renderResult(d, box) {
            var html = '<div class="stat">淘宝 ' + d.tb_count + ' 条 + 拼多多 ' + d.pdd_count + ' 条' +
                (d.manual_count ? ' + 人工录入 ' + d.manual_count + ' 条' : '') + ' = ' + d.total + ' 条候选</div>';
            if (!d.groups.length) { html += '<div class="empty">没有搜到结果</div>'; }
            d.groups.forEach(function(g) {
                html += '<div class="group"><div class="group-head"><span class="sku">📦 ' + g.key + '</span><span class="count">' + g.count + ' 个候选</span></div>';
                g.platforms.forEach(function(it) {
                    var isBest = g.best && it === g.best;
                    html += '<div class="item' + (isBest ? ' best' : '') + '">' +
                        '<span class="plat">' + (it.platform === 'tb' ? '淘宝' : '拼多多') + '</span>' +
                        '<div class="info"><div class="title">' + it.title + '</div>' +
                        '<div class="shop">' + (it.shopName || '') + (isBest ? '<span class="badge">最低价</span>' : '') + '</div></div>' +
                        '<div class="price"><div class="now">¥' + it.actualPrice + '</div>' +
                        (it.coupon_amount > 0 ? '<div class="coupon">券后省 ¥' + it.coupon_amount + '</div>' : '') +
                        (it.originalPrice > it.actualPrice ? '<div class="old">¥' + it.originalPrice + '</div>' : '') +
                        '</div></div>';
                });
                html += '</div>';
            });
            html += '<div style="text-align:center;margin-top:16px"><a href="/" class="back-home">← 再查一个</a></div>';
            box.innerHTML = html;
        }
    </script>
</body>
</html>
