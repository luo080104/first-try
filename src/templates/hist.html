<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搜索历史 - Go购</title>
<link rel="stylesheet" href="/static/style.css">
<style>
    body { background: #fafafa; font-family: -apple-system, 'Microsoft YaHei', sans-serif; }
    .container { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }
    h1 { font-size: 20px; margin: 8px 0 16px; }
    .day-group { margin-bottom: 20px; }
    .day-title { font-size: 13px; color: #b2bec3; margin: 10px 0 6px; padding-left: 2px; }
    .hist-item { display: flex; align-items: center; background: #fff; border-radius: 12px;
                  padding: 10px 14px; margin-bottom: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
                  cursor: pointer; transition: background .15s; }
    .hist-item:hover { background: #f0f7ff; }
    .hist-item .kw { flex: 1; font-size: 15px; color: #2d3436; }
    .hist-item .tm { font-size: 12px; color: #b2bec3; margin-right: 10px; }
    .hist-item .del { border: none; background: none; color: #b2bec3; font-size: 16px;
                      cursor: pointer; padding: 4px 8px; border-radius: 8px; }
    .hist-item .del:hover { background: #ffeaea; color: #d63031; }
    .clear-all { display: block; margin: 18px auto 0; background: none; border: 1px solid #dfe6e9;
                 color: #636e72; border-radius: 10px; padding: 8px 20px; font-size: 14px; cursor: pointer; }
    .clear-all:hover { border-color: #d63031; color: #d63031; }
    .empty { text-align: center; color: #b2bec3; margin-top: 60px; font-size: 14px; }
    .back { display: inline-block; margin-bottom: 10px; color: #0984e3; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
    <a class="back" href="/">← 返回首页</a>
    <h1>🕘 搜索历史</h1>
    <div id="hist-box"><div class="empty">加载中…</div></div>
    <button class="clear-all" onclick="clearAll()" id="clear-btn" style="display:none">🗑 清空全部历史</button>
</div>
<script>
    function esc(s) { return (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function curUser() { return localStorage.getItem('gobuy_current') || '嘉铭'; }

    function dayLabel(dateStr) {
        var today = new Date(); today.setHours(0,0,0,0);
        var d = new Date(dateStr); d.setHours(0,0,0,0);
        var diff = Math.round((today - d) / 86400000);
        if (diff === 0) return '今天';
        if (diff === 1) return '昨天';
        if (diff < 7) return diff + ' 天前';
        return dateStr.slice(0, 10);
    }

    function load() {
        fetch('/api/search_history?user_name=' + encodeURIComponent(curUser()))
            .then(r => r.json()).then(d => {
                var list = d.items || [];
                var box = document.getElementById('hist-box');
                document.getElementById('clear-btn').style.display = list.length ? 'block' : 'none';
                if (!list.length) { box.innerHTML = '<div class="empty">还没有搜索记录<br>去首页搜点什么吧</div>'; return; }
                // 按天分组（浏览器历史风格）
                var groups = {};
                list.forEach(function(it) {
                    var day = dayLabel(it.searched_at);
                    (groups[day] = groups[day] || []).push(it);
                });
                var html = '';
                Object.keys(groups).forEach(function(day) {
                    html += '<div class="day-group"><div class="day-title">' + day + '</div>';
                    groups[day].forEach(function(it) {
                        html += '<div class="hist-item" onclick="goSearch(\'' + esc(it.keyword).replace(/'/g, "\\'") + '\')">' +
                            '<span class="kw">🔍 ' + esc(it.keyword) + '</span>' +
                            '<span class="tm">' + (it.searched_at || '').slice(11, 16) + '</span>' +
                            '<button class="del" onclick="event.stopPropagation(); delOne(\'' + esc(it.keyword).replace(/'/g, "\\'") + '\')">✕</button></div>';
                    });
                    html += '</div>';
                });
                box.innerHTML = html;
            }).catch(function() { document.getElementById('hist-box').innerHTML = '<div class="empty">加载失败</div>'; });
    }

    function goSearch(kw) {
        // 带上下文回首页自动搜（搜全网）
        location.href = '/?search=1&q=' + encodeURIComponent(kw);
    }

    function delOne(kw) {
        fetch('/api/search_history_del', {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'keyword=' + encodeURIComponent(kw) + '&user_name=' + encodeURIComponent(curUser())})
            .then(r => r.json()).then(d => { if (d.ok) load(); });
    }

    function clearAll() {
        if (!confirm('确定清空全部搜索历史？')) return;
        fetch('/api/search_history_clear', {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'user_name=' + encodeURIComponent(curUser())})
            .then(r => r.json()).then(d => { if (d.ok) load(); });
    }
    load();
</script>
</body>
</html>
